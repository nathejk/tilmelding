volumes:
  ui-node_modules:
  api:

networks:
  local:
  traefik:
    external: true
  jetstream:
    external: true

services:
  ui:
    build:
      context: .
      target: ui-dev
      dockerfile: docker/Dockerfile
    environment:
      DEBUG: "true"
      NODE_ENV: development
      API_BASEURL: http://api.tilmelding.dev.nathejk.dk
    volumes:
      - ./vue:/app
      - ui-node_modules:/app/node_modules
    networks:
      - local
      - traefik
    labels:
      traefik.enable: true
      traefik.docker.network: traefik
      # HTTP router: redirect to HTTPS so the SPA always loads in a secure
      # context (needed for browser APIs gated behind HTTPS on non-localhost
      # hosts like *.local.nathejk.dk).
      traefik.http.routers.tilmelding.rule: Host(`tilmelding.local.nathejk.dk`)
      traefik.http.routers.tilmelding.entrypoints: web
      traefik.http.routers.tilmelding.middlewares: redirect-to-https
      # HTTPS router: serve with the desec (ACME) cert.
      traefik.http.routers.tilmelding-secure.rule: Host(`tilmelding.local.nathejk.dk`)
      traefik.http.routers.tilmelding-secure.entrypoints: websecure
      traefik.http.routers.tilmelding-secure.tls.certresolver: desec

  api:
    build:
      context: .
      target: base
      dockerfile: docker/Dockerfile
    environment:
      JETSTREAM_DSN: nats://jetstream:4222
      DB_DSN: bruger:kodeord@tcp(db:3306)/tilmelding?parseTime=true&multiStatements=true
      SMS_DSN: cpsms://TOKEN@api.cpsms.dk
      #MONOLITH_DB_DSN_RW: root:ib@tcp(dev.nathejk.dk:3306)/nathejk2018?parseTime=true
      PAYMENT_DSN: mobilepay://client_id:client_secret@apitest.vipps.no?Ocp-Apim-Subscription-Key#MSN
      BASEURL: https://tilmelding.local.nathejk.dk
      COUNTDOWN: "2026-04-29T21:16:00Z"
      COUNTDOWN_VIDEOS: |
        https://nathejk-countdown.s3.eu-central-1.amazonaws.com/videos/anne.mov
        https://nathejk-countdown.s3.eu-central-1.amazonaws.com/videos/caroline.mov
        https://nathejk-countdown.s3.eu-central-1.amazonaws.com/videos/jakob.mov
        https://nathejk-countdown.s3.eu-central-1.amazonaws.com/videos/karsten.mov
        https://nathejk-countdown.s3.eu-central-1.amazonaws.com/videos/klaus.mov
        https://nathejk-countdown.s3.eu-central-1.amazonaws.com/videos/michael.mov
        https://nathejk-countdown.s3.eu-central-1.amazonaws.com/videos/niels.mov
        https://nathejk-countdown.s3.eu-central-1.amazonaws.com/videos/nj.mov
        https://nathejk-countdown.s3.eu-central-1.amazonaws.com/videos/pia.mov
        https://nathejk-countdown.s3.eu-central-1.amazonaws.com/videos/sabrina.mov
        https://nathejk-countdown.s3.eu-central-1.amazonaws.com/videos/sanne.mov
        https://nathejk-countdown.s3.eu-central-1.amazonaws.com/videos/signe.mov
      SENIOR_COUNT: 115
      #GO_BUILD_FLAGS: -race
      SMTP_HOST: mail
      SMTP_PORT: 1025
    volumes:
      - ./go:/app
      # Sibling checkout of github.com/nathejk/shared-go. The path inside the
      # container matches what go/go.work expects (../../shared-go relative to
      # /app resolves to /shared-go).
      - ../shared-go:/shared-go
      - api:/go
    depends_on:
      - db
    networks:
      - local
      - jetstream

  db:
    image: mariadb:10.8
    environment:
      MYSQL_ROOT_PASSWORD: ib
      MYSQL_DATABASE: tilmelding
      MYSQL_USER: bruger
      MYSQL_PASSWORD: kodeord
      TZ: Europe/Copenhagen
    networks:
      - local

  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ib
      PMA_USER: bruger
      PMA_PASSWORD: kodeord
    depends_on:
      - db
    networks:
      - local
      - traefik
    labels:
      traefik.enable: true
      traefik.docker.network: traefik
      traefik.http.routers.tilmelding-sql.rule: Host(`sql.tilmelding.local.nathejk.dk`)

  mail:
    image: mailhog/mailhog:v1.0.1
    platform: linux/x86_64
    restart: unless-stopped
    networks:
      - local
      - traefik
    labels:
      traefik.enable: true
      traefik.docker.network: traefik
      traefik.http.routers.tilmelding-mail.rule: Host(`mail.tilmelding.local.nathejk.dk`)
      traefik.http.services.tilmelding-mail.loadbalancer.server.port: 8025
